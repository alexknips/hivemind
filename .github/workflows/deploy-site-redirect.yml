name: Deploy Site Redirect to GitHub Pages

# The site and docs moved to alexknips/hivemind-site. This repo's Pages URL
# (alexknips.github.io/hivemind/) stays up only as a redirect to it, so old
# links keep working. The page itself is site-redirect/index.html.

on:
  push:
    branches: [master]
    paths:
      - 'site-redirect/**'
      - '.github/workflows/deploy-site-redirect.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Assemble the redirect
        # The same page is the index and the 404 catch-all: Pages serves 404.html
        # for every path it does not have, which is how deep links reach it.
        run: |
          mkdir _site
          cp site-redirect/index.html _site/index.html
          cp site-redirect/index.html _site/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
