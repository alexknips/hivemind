name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust checks (${{ matrix.os }})${{ matrix.features && format(' +{0}', matrix.features) || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            features: ''
          - os: macos-latest
            features: ''
          - os: ubuntu-latest
            features: tui

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          components: ${{ matrix.features == '' && 'clippy, rustfmt' || 'clippy' }}

      - name: Check formatting
        if: matrix.features == ''
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets${{ matrix.features && format(' --features {0}', matrix.features) || '' }} -- -D warnings

      - name: Run tests
        run: cargo test --locked${{ matrix.features && format(' --features {0}', matrix.features) || '' }}

      - name: Build release binary
        if: matrix.features == ''
        run: cargo build --release --locked

  docker:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: hivemind:ci

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit

  # kuzu-feature disabled; see hivemind-oj7qr for re-enable plan.

  ubs:
    name: UBS critical scan
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install UBS
        run: |
          curl -fsSL "https://raw.githubusercontent.com/Dicklesworthstone/ultimate_bug_scanner/main/install.sh?$(date +%s)" \
            | bash -s -- --non-interactive
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run UBS critical scan
        # Runtime panic-surface signal should exclude test assertions, which are
        # test oracles rather than production invariants. benchmarks/ excluded per
        # the same policy as .ubsignore line 21 (hivemind-21zi): benchmark/eval
        # tooling is not production runtime code.
        run: ~/.local/share/ubs/modules/ubs-rust.sh . --format=json --quiet --ci --no-cargo --exclude=benchmarks,worktrees --exclude-tests --fail-critical=1

      # UBS warning baseline established by hivemind-ubs-warning-triage-baseline-h4p2m and
      # tightened by hivemind-41n8s on 2026-05-22 with `ubs --ci --only=rust .`.
      # Bumped from 1900 -> 3164 on 2026-05-25 to unblock master after recent
      # backend work landed without paying the warning count down per PRINCIPLES §8.
      # Tightened from 3164 -> 3039 on 2026-06-18 (hivemind-yfbq) after adding
      # tests/mcp_stdio_e2e.rs to .ubsignore (d27b80c) — test assertions are excluded
      # from the warning baseline, consistent with tests/api.rs and tests/multi_tenant.rs.
      # Tightened from 3039 -> 308 on 2026-06-20 (hivemind-ubs-warning-paydown-3164-lkfp)
      # after expanding .ubsignore to cover all remaining in-tree test modules
      # (src/*/tests.rs) and all tests/ integration-test files. These are #[cfg(test)]
      # or integration-test code; test-assert noise belongs in --exclude-tests (critical
      # gate), not the warning-count baseline. Remaining 308 warnings are in production
      # src/: 139 format!/to_string inside loops (tracked hivemind-41n8s), 90 clone()
      # occurrences, 43 unwrap/expect, 24 asserts, 12 indexing/cast warnings.
      # Top categories still tracked: unwrap/expect panic inventory (hivemind-dfc5e),
      # runtime panic surfaces (hivemind-gofiy), loop allocation inventory (hivemind-41n8s).
      - name: Run UBS warning baseline scan
        shell: bash
        run: |
          set -euo pipefail
          baseline_warnings=308
          ~/.local/bin/ubs --ci --only=rust --report-json=/tmp/ubs-warning-summary.json .
          warnings="$(jq -r '.totals.warning' /tmp/ubs-warning-summary.json)"
          if [ "${warnings}" -gt "${baseline_warnings}" ]; then
            echo "UBS warning count grew from ${baseline_warnings} to ${warnings}."
            exit 1
          fi
          echo "UBS warning count ${warnings} is within baseline ${baseline_warnings}."
