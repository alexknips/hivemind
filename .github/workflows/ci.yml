name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust checks (${{ matrix.os }})${{ matrix.features && format(' +{0}', matrix.features) || '' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            features: ''
          - os: macos-latest
            features: ''
          - os: ubuntu-latest
            features: tui
          # shared-backend-postgres runs as its own job (rust-postgres, below)
          # rather than as a matrix leg here: it needs a live `services:
          # postgres` container, which GitHub-hosted macOS/Windows runners
          # (also in this matrix) cannot provide. Its job carries the exact
          # `name:` this leg used to render ("Rust checks (ubuntu-latest)
          # +shared-backend-postgres") so the branch ruleset's required
          # status check keeps matching.

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          components: ${{ matrix.features == '' && 'clippy, rustfmt' || 'clippy' }}

      - name: Check formatting
        if: matrix.features == ''
        run: cargo fmt --check

      - name: Run clippy
        run: cargo clippy --locked --all-targets${{ matrix.features && format(' --features {0}', matrix.features) || '' }} -- -D warnings

      - name: Run tests
        run: cargo test --locked${{ matrix.features && format(' --features {0}', matrix.features) || '' }}

      - name: Build release binary
        if: matrix.features == ''
        run: cargo build --release --locked

  # shared-backend-postgres split out of the `rust` matrix above: it needs a
  # live `services: postgres` container to actually run
  # ledger/projector/queries Postgres tests instead of self-skipping (and to
  # let ledger::postgres::tests::async_safety_tests::pass_after_spawn_blocking_is_async_safe,
  # which deliberately panics without HIVEMIND_TEST_POSTGRES_URL, run for
  # real). Service containers require a Linux runner, which the `rust` job's
  # macos-latest leg cannot provide, so this is its own ubuntu-only job. Its
  # `name:` is fixed to the exact string that job's matrix used to render for
  # this leg, so the branch ruleset's required status check
  # ("Rust checks (ubuntu-latest) +shared-backend-postgres") keeps matching.
  rust-postgres:
    name: Rust checks (ubuntu-latest) +shared-backend-postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: hivemind
          POSTGRES_USER: hivemind
          POSTGRES_PASSWORD: hivemind
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U hivemind -d hivemind"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          components: clippy

      - name: Run clippy
        run: cargo clippy --locked --all-targets --features shared-backend-postgres -- -D warnings

      - name: Run tests
        env:
          HIVEMIND_TEST_POSTGRES_URL: postgres://hivemind:hivemind@localhost:5432/hivemind
          # Caps the r2d2 pool size opened per `PostgresEventLedger::connect`
          # call (production default is 16, eagerly filled). Each parallel
          # test thread opens its own pool through this path, directly or
          # via AnyLedger's CLI backend selection, so at default parallelism
          # N-threads x 16 easily exceeds Postgres's max_connections=100.
          HIVEMIND_POSTGRES_POOL_SIZE: "4"
        run: cargo test --locked --features shared-backend-postgres

  docker:
    name: Docker build
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: hivemind:ci

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo audit
        run: cargo audit

  reference-docs:
    name: Reference docs in sync
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Check reference docs match source
        run: cargo run --locked --bin generate-reference -- --check

  actionlint:
    name: Lint GitHub Actions workflows
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run actionlint
        run: ./scripts/lint-workflows.sh

  # kuzu-feature disabled; see hivemind-oj7qr for re-enable plan.

  ubs:
    name: UBS critical scan
    runs-on: ubuntu-latest
    # hivemind-0qwf: the rust module runs `cargo clippy --all-features`, a
    # heavier build than the default-feature checks elsewhere in this
    # workflow (this crate's postgres/kuzu/tui features add real compile
    # time). That reliably exceeds UBS's 300s per-module default even with a
    # warm target/ cache, so the module is killed mid-scan and the run comes
    # back "partial" instead of a real result. Raise the budget; drop once
    # upstream's own default is high enough for multi-feature crates.
    env:
      UBS_MODULE_TIMEOUT: "1200"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # hivemind-eako / hivemind-eako.3: without a Rust toolchain + cargo-audit
      # on PATH, UBS's dependency-hygiene category (14) can't run `cargo audit`
      # (HAS_AUDIT=0 in ubs-rust.sh) and silently reports an "info" skip finding
      # instead of a real result. That made this job blind to advisories that a
      # local host WITH cargo-audit installed reports as criticals — a
      # local-vs-CI divergence in a mandatory gate. Install both here so this
      # job's cargo-audit result matches local, mirroring the dependency-audit
      # job above.
      - name: Setup Rust
        uses: ./.github/actions/setup-rust

      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Install UBS
        run: |
          curl -fsSL "https://raw.githubusercontent.com/Dicklesworthstone/ultimate_bug_scanner/main/install.sh?$(date +%s)" \
            | bash -s -- --non-interactive
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          # hivemind-eako.3: the installed `ubs` binary's generate_combined_json()
          # resolves its Python findings-merge helpers via
          # `dirname "${BASH_SOURCE[0]}"`/modules/helpers -- i.e. relative to the
          # installed *binary's* directory ($HOME/.local/bin) -- but install.sh
          # actually puts them under $HOME/.local/share/ubs/modules/helpers. That
          # first path never exists, so `[[ -d "$helpers_dir/ubs_core" ]]` is
          # always false and the findings-merge step (which --baseline/--new-only
          # depends on to fingerprint-match findings) silently never runs, for
          # any language, no matter what flags are passed. Confirmed by reading
          # ~/.local/bin/ubs and reproducing locally: --baseline/--new-only was a
          # complete no-op through the real CLI. Symlink the path the binary
          # expects to the real one so the mechanism UBS itself documents
          # actually executes. Drop this once upstream fixes the path.
          mkdir -p "$HOME/.local/bin/modules"
          ln -sfn "$HOME/.local/share/ubs/modules/helpers" "$HOME/.local/bin/modules/helpers"

      - name: Run UBS critical scan
        # Runtime panic-surface signal should exclude test assertions, which are
        # test oracles rather than production invariants. benchmarks/ excluded per
        # the same policy as .ubsignore line 21 (hivemind-21zi): benchmark/eval
        # tooling is not production runtime code. Directory exclusions (benchmarks/,
        # worktrees/, tests/) are already covered by .ubsignore; the meta-runner
        # picks them up automatically. Uses the ubs meta-runner instead of the
        # module script directly: newer UBS releases no longer pre-install module
        # scripts at install time, so ~/.local/share/ubs/modules/ubs-rust.sh is
        # absent after a fresh install and direct invocation fails with exit 127
        # (hivemind-13n5). The meta-runner downloads modules on first use.
        #
        # --include-ext=rs works around hivemind-0qwf: UBS 5.4.1 ships without
        # modules/contract.json (missing from its own supply-chain manifest, so
        # `ubs doctor` reports all-green while detection is broken). Its language
        # prepass classifies files via that missing contract, so every language's
        # file list comes back empty and detect_lang() reports "no supported
        # languages" (exit 3) without ever running a scanner. --include-ext
        # bypasses the empty contract via UBS's extension-hint fallback. Drop this
        # flag once upstream ships/repairs contract.json.
        #
        # --baseline=.github/ubs-baseline.json --new-only (hivemind-eako.3):
        # now that cargo-audit runs here, category 14 (dependency hygiene)
        # reports every `cargo audit` line matching "Vulnerability|RUSTSEC" as
        # one critical finding — 12 lines today, for the 6 informational
        # advisories .cargo/audit.toml already allows (unmaintained/unsound,
        # `cargo audit` itself exits 0). UBS bundles that into a single
        # "Advisories found by cargo-audit" finding rather than one per
        # advisory, so it can't be allow-listed per-RUSTSEC-ID; --new-only
        # (UBS's supported "known findings don't fail; new ones do" mechanism)
        # is applied via a fingerprint of that finding, checked into
        # .github/ubs-baseline.json. Caveat: because the finding is one bucket
        # per cargo-audit run rather than one per advisory, a genuinely new
        # advisory landing later stays inside the same bucket/fingerprint and
        # would NOT retrigger this gate on its own. The dependency-audit job
        # above is the authoritative real-vulnerability gate (cargo audit's own
        # exit code against .cargo/audit.toml) and is unaffected by this
        # baseline. --format=json is required here: findings-merge (which
        # --new-only needs to fingerprint-match against the baseline) only
        # sees per-finding data when the rust module is invoked in JSON mode;
        # in the default text format the module never writes its NDJSON sink,
        # so there is nothing to filter and totals.critical stays unfiltered.
        # Its (large) JSON is redirected away since only the report file
        # matters here; on failure, the finding breakdown below explains why.
        # Regenerate the baseline after a genuine change here with:
        #   cargo install cargo-audit --locked
        #   ubs --ci --only=rust --include-ext=rs --skip-rust=12,13 \
        #     --format=json --save-baseline=.github/ubs-baseline.json .
        # (--skip-rust=12,13 skips the slow clippy/build categories, which
        # this baseline doesn't need, so it saves in seconds instead of
        # minutes.)
        shell: bash
        run: |
          set -euo pipefail
          ubs --ci --only=rust --include-ext=rs --format=json \
            --baseline=.github/ubs-baseline.json --new-only \
            --report-json=/tmp/ubs-critical-summary.json . >/dev/null
          criticals="$(jq -r '.totals.critical // 0' /tmp/ubs-critical-summary.json)"
          if [ "${criticals}" -gt 0 ]; then
            echo "UBS critical count: ${criticals}. Failing."
            jq -c '.findings[]? | select(.severity=="critical")' /tmp/ubs-critical-summary.json || true
            exit 1
          fi
          echo "UBS critical count ${criticals} — OK."

      # UBS warning baseline established by hivemind-ubs-warning-triage-baseline-h4p2m and
      # tightened by hivemind-41n8s on 2026-05-22 with `ubs --ci --only=rust .`.
      # Bumped from 1900 -> 3164 on 2026-05-25 to unblock master after recent
      # backend work landed without paying the warning count down per PRINCIPLES §8.
      # Tightened from 3164 -> 3039 on 2026-06-18 (hivemind-yfbq) after adding
      # tests/mcp_stdio_e2e.rs to .ubsignore (d27b80c) — test assertions are excluded
      # from the warning baseline, consistent with tests/api.rs and tests/multi_tenant.rs.
      # Tightened from 3039 -> 308 on 2026-06-20 (hivemind-ubs-warning-paydown-3164-lkfp)
      # after expanding .ubsignore to cover all remaining in-tree test modules
      # (src/*/tests.rs) and all tests/ integration-test files. These are #[cfg(test)]
      # or integration-test code; test-assert noise belongs in --exclude-tests (critical
      # gate), not the warning-count baseline. Remaining 308 warnings are in production
      # src/: 139 format!/to_string inside loops (tracked hivemind-41n8s), 90 clone()
      # occurrences, 43 unwrap/expect, 24 asserts, 12 indexing/cast warnings.
      # Top categories still tracked: unwrap/expect panic inventory (hivemind-dfc5e),
      # runtime panic surfaces (hivemind-gofiy), loop allocation inventory (hivemind-41n8s).
      - name: Run UBS warning baseline scan
        # --include-ext=rs: see hivemind-0qwf comment on the critical-scan step above.
        #
        # `|| true` on the ubs invocation (hivemind-eako.3): this step only
        # gates on .totals.warning, but ubs's own exit code reflects
        # .totals.critical too, and this job now installs cargo-audit (see
        # the critical-scan step above), so this step's un-suppressed
        # category-14 scan sees the same 12 allow-listed advisories as
        # criticals and ubs itself exits 1 -- which, under `set -e`, aborted
        # this step before the warnings check below ever ran. This step
        # doesn't use --baseline/--new-only (it has no reason to filter
        # criticals), so it tolerates that nonzero exit and judges the run
        # solely by the warning count it actually wrote to the report file.
        shell: bash
        run: |
          set -euo pipefail
          baseline_warnings=308
          ~/.local/bin/ubs --ci --only=rust --include-ext=rs --report-json=/tmp/ubs-warning-summary.json . || true
          warnings="$(jq -r '.totals.warning' /tmp/ubs-warning-summary.json)"
          if [ "${warnings}" -gt "${baseline_warnings}" ]; then
            echo "UBS warning count grew from ${baseline_warnings} to ${warnings}."
            exit 1
          fi
          echo "UBS warning count ${warnings} is within baseline ${baseline_warnings}."

  # Smoke-tests the full HTTP server path against a real Docker Compose cell
  # (SQLite backend, no LLM key required). Covers: capture via HTTP + CLI + MCP
  # stdio, query, search, review, disagree, supersede, supersession chain,
  # multi-tenant isolation, quality-scan via MCP, and spectral map. The
  # subscription/edge LLM legs (claude -p + plugin, hivemind-fabq.3) are
  # LOCAL-only and SKIP unconditionally here — no Claude subscription on CI
  # runners.
  e2e-compose:
    name: E2E compose smoke (SQLite)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: hivemind:e2e

      - name: Start HiveMind (SQLite, no auth)
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.e2e-sqlite.yml \
            up -d --no-deps hivemind
          echo "Waiting for /v1/health..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/v1/health | grep -q '"ok"'; then
              echo "Server ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:8080/v1/health | grep '"ok"'

      - name: Install Rust toolchain (for hivemind binary)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build hivemind + fidelity-eval binaries
        run: cargo build --locked --features eval-tools --bin hivemind --bin fidelity-eval

      - name: Run E2E smoke (SQLite)
        env:
          HIVEMIND_BIN: ./target/debug/hivemind
          FIDELITY_BIN: ./target/debug/fidelity-eval
        run: bash scripts/e2e_smoke.sh

      - name: Dump server logs on failure
        if: failure()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.e2e-sqlite.yml \
            logs hivemind

      - name: Stop compose
        if: always()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.e2e-sqlite.yml \
            down -v

  # Smoke-tests the full HTTP server path against a real Docker Compose cell
  # (Postgres backend, no LLM key required). Spectral-map endpoint skipped per
  # hivemind-270r (SQLite only). Covers the same paths as e2e-compose but exercises
  # the Postgres storage path end-to-end.
  e2e-compose-postgres:
    name: E2E compose smoke (Postgres)
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: hivemind:e2e

      - name: Start HiveMind (Postgres)
        env:
          HIVEMIND_ADMIN_KEY: e2e-admin-key-ci
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.e2e-postgres.yml \
            up -d
          echo "Waiting for /v1/health..."
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/v1/health | grep -q '"ok"'; then
              echo "Server ready after ${i}s"
              break
            fi
            sleep 1
          done
          curl -sf http://localhost:8080/v1/health | grep '"ok"'

      - name: Install Rust toolchain (for hivemind binary)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build hivemind binary
        run: cargo build --locked --bin hivemind

      - name: Provision Postgres tenants and run E2E smoke
        env:
          HIVEMIND_BIN: ./target/debug/hivemind
        run: |
          # Provision tenant A (e2e-test)
          prov_a=$(curl -sf -X POST http://localhost:8080/v1/tenants \
            -H "Authorization: Bearer e2e-admin-key-ci" \
            -H "Content-Type: application/json" \
            -d '{"tenant_id":"e2e-test","display_name":"E2E Test Tenant A"}')
          TOKEN_A=$(echo "$prov_a" | jq -r '.token_secret')
          if [ -z "$TOKEN_A" ] || [ "$TOKEN_A" = "null" ]; then
            echo "ERROR: failed to provision tenant A: $prov_a"; exit 1
          fi
          echo "Tenant A provisioned: ${TOKEN_A:0:12}..."

          # Provision tenant B (e2e-test-other) for multi-tenant isolation test
          prov_b=$(curl -sf -X POST http://localhost:8080/v1/tenants \
            -H "Authorization: Bearer e2e-admin-key-ci" \
            -H "Content-Type: application/json" \
            -d '{"tenant_id":"e2e-test-other","display_name":"E2E Test Tenant B"}')
          TOKEN_B=$(echo "$prov_b" | jq -r '.token_secret')
          if [ -z "$TOKEN_B" ] || [ "$TOKEN_B" = "null" ]; then
            echo "ERROR: failed to provision tenant B: $prov_b"; exit 1
          fi
          echo "Tenant B provisioned: ${TOKEN_B:0:12}..."

          HIVEMIND_E2E_API_KEY="$TOKEN_A" \
          HIVEMIND_E2E_API_KEY_B="$TOKEN_B" \
            bash scripts/e2e_smoke.sh

      - name: Dump server logs on failure
        if: failure()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.e2e-postgres.yml \
            logs hivemind
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.e2e-postgres.yml \
            logs postgres

      - name: Stop compose
        if: always()
        run: |
          docker compose \
            -f docker-compose.yml \
            -f docker-compose.e2e-postgres.yml \
            down -v
