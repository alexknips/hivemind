name: Setup Rust
description: Install Rust toolchain and restore cargo cache (checkout must precede this action)
inputs:
  components:
    description: Comma-separated Rust components (e.g. clippy, rustfmt)
    default: ''
  targets:
    description: Comma-separated compilation targets
    default: ''
runs:
  using: composite
  steps:
    - name: Install Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        components: ${{ inputs.components }}
        targets: ${{ inputs.targets }}

    - name: Cache cargo artifacts
      uses: Swatinem/rust-cache@v2
